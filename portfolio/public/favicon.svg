<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Purple terminal favicon">
  <defs>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16171c"/>
      <stop offset="100%" stop-color="#0f1014"/>
    </linearGradient>
    <linearGradient id="topShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4d5c"/>
      <stop offset="100%" stop-color="#3f4250"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C98BFF"/>
      <stop offset="100%" stop-color="#B778F4"/>
    </linearGradient>
    <clipPath id="clipCard">
      <rect x="8" y="8" width="240" height="240" rx="42" ry="42"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="42" ry="42" fill="url(#bodyShade)"/>
  <g clip-path="url(#clipCard)">
    <rect x="8" y="8" width="240" height="72" fill="url(#topShade)"/>
  </g>

  <circle cx="54" cy="45" r="11" fill="url(#purpleGlow)"/>
  <circle cx="92" cy="45" r="11" fill="#b8bac4" opacity="0.95"/>

  <path d="M70 112 L122 154 L70 196" fill="none" stroke="url(#purpleGlow)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="138" y="181" width="64" height="18" rx="9" fill="url(#purpleGlow)"/>
</svg>
